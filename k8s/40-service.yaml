# Service interno do Execução Service. A exposição para fora do cluster (load
# balancer, API Gateway, rota do webhook do Mercado Pago) é decidida na
# etapa de nuvem — ver docs/fase-4/arquitetura.md §11 e RFC 004.
apiVersion: v1
kind: Service
metadata:
  name: oficina-execucao
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-execucao
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oficina-execucao
  ports:
    - name: http
      port: 80
      targetPort: http
