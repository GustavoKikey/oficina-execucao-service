# Service do Execução Service dentro do cluster (smoke test do deploy, port-forward).
# Fora do cluster: 45-service-publico.yaml (mecânico (fila, diagnóstico, reparo) e estoque), restrito por IP.
apiVersion: v1
kind: Service
metadata:
  name: oficina-execucao
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-execucao
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oficina-execucao
  ports:
    - name: http
      port: 80
      targetPort: http
